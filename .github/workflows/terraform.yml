name: "Terraform GitOps Pipeline"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform & Deploy"
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのコードをチェックアウト
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. OIDC 経由で AWS 認証
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::073345634859:role/github-actions-terraform-role
          aws-region: ap-northeast-1

      # 3. Terraform CLI のセットアップ
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # 4. Terraform 初期化
      - name: Terraform Init
        run: terraform init

      # 5. Terraform フォーマット確認
      - name: Terraform Format
        run: terraform fmt -check

      # 6. Terraform バリデーション
      - name: Terraform Validate
        run: terraform validate

      # 7. PR 時のみ：Terraform Plan 実行とコメント書き出し
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color
        continue-on-error: true

      # 8. Main マージ時のみ：Terraform Apply 実行
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve

      # -------------------------------------------------------------
      # ★ 追加：Main マージ時のみ アプリ資産（HTML）を S3 へ自動デプロイ
      # -------------------------------------------------------------
      - name: Deploy Static Files to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws s3 sync . s3://shuma-static-site-20261002 \
            --exclude "*" \
            --include "index.html" \
            --delete

      # ★ 追加：CloudFront のキャッシュを自動破棄（即時反映させるため）
      - name: Invalidate CloudFront Cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[0].DomainName=='shuma-static-site-20261002.s3.ap-northeast-1.amazonaws.com'].Id" --output text)
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"